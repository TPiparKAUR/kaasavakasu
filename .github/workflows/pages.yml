name: Veebileht

# Ehitab saidi igal pushil (kontrolliks) ja avaldab GitHub Pages'is ainult repo VAIKEHARUST,
# olenemata selle nimest. Vajab: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1 leht ehitatakse commit'ist V1_COMMIT
      - uses: astral-sh/setup-uv@v5
      # Iga avaldatud metoodika versioon ehitatakse oma kindlast commit'ist, nii et hilisemad muudatused vaikeharus
      # seda ei muuda. v1 (keskmised) peaaadressil muutmata kujul; v2 (mediaanid) aadressil /v2/ (ainult otselink,
      # v1 lehel viidet ei ole; v2 lehed on märgitud noindex). Peaaadressi vahetamiseks: ehita soovitud versioon _site-i.
      - name: Ehita v1 leht (commit V1_COMMIT) peaaadressile
        env:
          V1_COMMIT: 5aa4596
        run: |
          git worktree add ../v1 "$V1_COMMIT"
          (cd ../v1 && uv sync --frozen && uv run python -m oks site --out "$GITHUB_WORKSPACE/_site")
      - name: Ehita v2 leht (commit V2_COMMIT) aadressile /v2/
        env:
          V2_COMMIT: de7aca9
        run: |
          git worktree add ../v2 "$V2_COMMIT"
          (cd ../v2 && uv sync --frozen && uv run python -m oks site --out "$GITHUB_WORKSPACE/_site/v2")
      # Metoodika v3 (kuivad ja märjad metsad statistilises analüüsis) ehitatakse vaikeharu seisust aadressile /v3/.
      # Tagasi v2-le: git revert v3 commit; see eemaldab ka selle sammu.
      - run: uv sync --frozen
      - run: uv run python -m oks site --out _site/v3
      - name: v2 ja v3 lehed otsingumootoritest välja
        run: |
          for f in _site/v2/*.html _site/v3/*.html; do
            sed -i '0,/<head>/s||<head>\n<meta name="robots" content="noindex, nofollow">|' "$f"
          done
      - name: Kontrolli, et leht ja andmed on olemas
        run: |
          for d in _site _site/v2 _site/v3; do
            test -s $d/index.html
            test -s $d/data/paarid.json
            test -s $d/oks-seisund.html
          done
          grep -q 'name="robots" content="noindex' _site/v2/index.html
          grep -q 'name="robots" content="noindex' _site/v3/index.html
          ! grep -q 'name="robots"' _site/index.html
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
