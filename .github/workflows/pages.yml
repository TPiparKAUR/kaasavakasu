name: Veebileht

# Ehitab saidi igal pushil (kontrolliks) ja avaldab GitHub Pages'is ainult repo VAIKEHARUST,
# olenemata selle nimest. Vajab: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1 leht ehitatakse commit'ist V1_COMMIT
      - uses: astral-sh/setup-uv@v5
      # Metoodika v1 (keskmised) jääb peaaadressile, v2 (mediaanid) on aadressil /v2/.
      # Vahetamiseks: ehita v2 otse _site-i ja eemalda v1 sammud.
      - name: Ehita v1 leht (commit V1_COMMIT) peaaadressile
        env:
          V1_COMMIT: 5aa4596
        run: |
          git worktree add ../v1 "$V1_COMMIT"
          (cd ../v1 && uv sync --frozen && uv run python -m oks site --out "$GITHUB_WORKSPACE/_site")
          for f in index.html oks-seisund.html; do
            link=v2/; [ "$f" = oks-seisund.html ] && link=v2/oks-seisund.html
            sed -i "0,/<body>/s||<body>\n<p style=\"margin:0;padding:8px 16px;background:#fff4d6;color:#3a2f00;font:14px/1.4 system-ui,sans-serif\">Vana metoodika (v1, keskmised). Uus metoodika (v2, mediaanid): <a href=\"$link\">ava v2</a></p>|" "_site/$f"
          done
      - run: uv sync --frozen
      - run: uv run python -m oks site --out _site/v2
      - name: Kontrolli, et leht ja andmed on olemas
        run: |
          for d in _site _site/v2; do
            test -s $d/index.html
            test -s $d/data/paarid.json
            test -s $d/oks-seisund.html
          done
          grep -q 'ava v2' _site/index.html
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
