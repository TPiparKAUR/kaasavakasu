name: Veebileht

# Ehitab saidi igal pushil (kontrolliks) ja avaldab GitHub Pages'is ainult repo VAIKEHARUST,
# olenemata selle nimest. Vajab: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1 leht ehitatakse commit'ist V1_COMMIT
      - uses: astral-sh/setup-uv@v5
      # Metoodika v1 (keskmised) jääb peaaadressile muutmata kujul, v2 (mediaanid) on aadressil /v2/ (ainult otselink,
      # v1 lehel viidet ei ole; v2 lehed on märgitud noindex). Vahetamiseks: ehita v2 otse _site-i ja eemalda v1 samm.
      - name: Ehita v1 leht (commit V1_COMMIT) peaaadressile
        env:
          V1_COMMIT: 5aa4596
        run: |
          git worktree add ../v1 "$V1_COMMIT"
          (cd ../v1 && uv sync --frozen && uv run python -m oks site --out "$GITHUB_WORKSPACE/_site")
      - run: uv sync --frozen
      - run: uv run python -m oks site --out _site/v2
      - name: v2 lehed otsingumootoritest välja
        run: |
          for f in _site/v2/*.html; do
            sed -i '0,/<head>/s||<head>\n<meta name="robots" content="noindex, nofollow">|' "$f"
          done
      - name: Kontrolli, et leht ja andmed on olemas
        run: |
          for d in _site _site/v2; do
            test -s $d/index.html
            test -s $d/data/paarid.json
            test -s $d/oks-seisund.html
          done
          grep -q 'name="robots" content="noindex' _site/v2/index.html
          ! grep -q 'name="robots"' _site/index.html
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
